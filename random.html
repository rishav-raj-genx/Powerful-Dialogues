<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
      }
      div {
        font-size: 3rem;
        gap: 5rem;
        text-align: center;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      button {
        padding: 1rem 2rem;
        border: 2px dashed white;
        font-size: larger;
        border-radius: 5rem;
        font-family: cursive;
        font-weight: bolder;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Men Are Brave!</h1>
        <button>Powerful Quote Generator!</button>
      </div>
      <section>

      </section>`
    </main>

    <script>
      let div = document.querySelector("div");
      let section = document.querySelector("section");
      let button = document.querySelector("button");
      let h1 = document.querySelector("h1");

       const quotes = [
        "PowerFul People Makes Places PowerFul!",
        "I Have To Become More!",
        "Did You Forget, Who I am!",
        "Say My Name!",
        "First Rule Of Fight Club!, is...",
        "Consequences!",
        "Men Are Brave!",
        "Never Settle!",
      ]

      button.addEventListener("click", but);
      button.addEventListener("mouseover", over);

      function but() {
        const index = Math.floor(Math.random()*quotes.length);
        h1.textContent = quotes[index];
      }

      function over(){
        let p = document.createElement("p")
        p.innerHTML = `Just Do It!`;
        section.append(p);
      }

    </script>
  </body>
</html>
